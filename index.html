      + '<div class="acb-worked"><span class="acb-worked-label">Worked example</span><p>A retailer with a 50,000-SKU catalog and modest search traffic is well served by pgvector bolted onto their existing product database \u2014 no new infrastructure needed. A media company indexing 500 million video embeddings for a global recommendation feed needs a dedicated, distributed vector database \u2014 the query volume and index size alone rule out a bolt-on approach. Same underlying technology, completely different infrastructure decision, driven entirely by scale.</p></div>'},

    {id:'m17', group:'part3', num:'21', tag:'infrastructure', title:'Model Selection & Evaluation', skill:'Comparing and choosing between LLMs and vendors \u2014 the tradeoffs a PM actually owns.',
      body: '<p>Models aren\u2019t interchangeable. They differ in cost per token, latency, context window size, reasoning quality, and licensing or data-residency terms \u2014 and the "best" model on a public benchmark isn\u2019t necessarily the right one for your feature.</p>'
      + '<h4>The axes that actually matter for a PM decision</h4><ul><li><b>Quality</b> \u2014 does it solve your specific task well enough, not a generic benchmark</li><li><b>Cost at your expected volume</b> \u2014 a small per-call cost difference compounds fast at scale</li><li><b>Latency</b> \u2014 real-time chat has a very different bar than an overnight batch job</li><li><b>Context window</b> \u2014 how much data has to fit in a single call</li><li><b>Vendor lock-in</b> \u2014 how expensive would switching be later</li><li><b>Compliance</b> \u2014 where is data processed, does the vendor train on your data</li></ul>'
      + '<p>The practical move: don\u2019t decide on benchmarks or vibes alone. Build a small evaluation set (this connects directly to Module 16) against your actual use case, and test candidate models against it before committing.</p>'
      + '<div class="acb-checkpoint"><span class="acb-cp-label">Skill checkpoint</span>Given a feature requirement, you should be able to rank cost, latency, quality, and context window by priority for that specific case.</div>'
      + '<div class="acb-worked"><span class="acb-worked-label">Worked example</span><p>A high-volume support-ticket triage feature prioritizes low latency and low cost per call above all \u2014 it runs thousands of times a day and users expect a near-instant routing decision, so a fast, cheap model wins even if a slower model reasons slightly better. A monthly board-report generation feature runs a handful of times and can tolerate 30 extra seconds \u2014 there, quality and reasoning depth dominate the decision, and cost per call barely matters at that volume.</p></div>'},

    {id:'m27', group:'part3', num:'22', tag:'infrastructure', title:'Cost Engineering for AI Products', skill:'AI economics \u2014 where the money actually goes, and the levers a PM has to control it.',
      body: '<p>Most LLM APIs charge per token, and <b>input tokens</b> (what you send) and <b>output tokens</b> (what it generates) are usually priced differently, with output typically costing more. A bloated system prompt or a verbose conversation history has a real, recurring dollar cost \u2014 not just an abstract "context window" concern.</p>'
      + '<h4>Where the spend actually comes from</h4><ul><li><b>Context window cost</b> \u2014 everything you stuff into context gets paid for on every single call, not once. This is the direct financial argument for Module 15\u2019s memory and summarization strategies.</li>'
      + '<li><b>Prompt optimization</b> \u2014 trimming an over-long system prompt or shortening few-shot examples (Module 13) is a genuine cost lever, not just tidiness.</li>'
      + '<li><b>Retrieval cost</b> \u2014 every RAG/GraphRAG call (Module 9) inserts retrieved content into the prompt; more chunks retrieved "to be safe" means more input tokens, every time.</li>'
      + '<li><b>Embedding cost</b> \u2014 generating and storing embeddings (Module 20) isn\u2019t free either, especially at re-indexing scale.</li>'
      + '<li><b>Caching</b> \u2014 reusing a prior response or retrieval result instead of recomputing it is one of the highest-leverage, most underused cost levers, especially for repeated or near-identical queries.</li>'
      + '<li><b>Multi-agent cost</b> \u2014 connects directly to Module 18: every extra agent hop is another full model call, so a 4-agent pipeline can easily cost several times a single well-designed agent, compounding fast at volume.</li></ul>'
      + '<h4>Latency vs. cost vs. "the biggest model"</h4><p>Faster models and infrastructure usually cost more \u2014 a real-time feature can\u2019t use a slow, cheap model just to save money. And the newest, largest model is not automatically the right default: bigger models cost more per token and are often slower, so matching model size to task difficulty (Module 21) is a real skill, not a formality.</p>'
      + '<div class="acb-callout"><b>PM decision framework:</b> before launch, ask (1) what\u2019s the cost per interaction at expected volume, (2) which levers above \u2014 caching, model right-sizing, prompt trimming, retrieval limits \u2014 have actually been tried, and (3) what cost ceiling would make this feature not worth running.</div>'
      + '<div class="acb-checkpoint"><span class="acb-cp-label">Skill checkpoint</span>Given a feature\u2019s usage volume and per-call cost, estimate monthly cost and identify 2 levers to reduce it.</div>'
      + '<div class="acb-worked"><span class="acb-worked-label">Worked example</span><p>A support copilot handles 50,000 conversations a month on a premium model, and the team discovers 80% of those conversations are simple FAQ-style questions a much cheaper model handles just as well. Routing that 80% to a cheaper model, and caching the top 20 most-repeated FAQ answers instead of regenerating them every time, cuts the monthly bill dramatically \u2014 without touching the 20% of conversations that genuinely need the stronger model. Model right-sizing and caching, applied together, not a model swap alone.</p></div>'},

    {id:'m18', group:'part3', num:'23', tag:'execution', title:'Running the Data & Entity Modeling Workshop', skill:'How a PM actually facilitates the ontology-building session with engineers \u2014 turning Module 5\u2019s sketch into a real practice.',
      body: '<p>Module 5 asked you to sketch an ontology on paper. In the real world, that sketch gets built in a room with domain experts and engineers \u2014 and running that session well is a distinct, learnable skill.</p>'
      + '<h4>A repeatable workshop format</h4><ol><li>Whiteboard the <b>nouns</b> first \u2014 entities only, no relationships yet. Cap it at 5\u20137 on the first pass.</li><li>Add the <b>verbs</b> \u2014 relationships connecting those entities.</li><li>Stress-test with 3\u20135 real business questions the model needs to answer \u2014 not hypothetical ones.</li><li>Formalize into notation engineers can build from.</li></ol>'
      + '<p>The PM\u2019s actual job in that room isn\u2019t drawing boxes \u2014 it\u2019s keeping scope tight (resisting the urge to model every entity anyone mentions), translating vague business questions into concrete graph-traversal tests, and writing down <i>why</i> a modeling decision was made so it doesn\u2019t get relitigated three sprints later.</p>'
      + '<div class="acb-checkpoint"><span class="acb-cp-label">Skill checkpoint</span>Design a 60-minute workshop agenda for modeling one domain from your own work.</div>'
      + '<div class="acb-worked"><span class="acb-worked-label">Worked example</span><p>A subscription SaaS company runs this workshop and lands on 5 entities: Customer, Subscription, Plan, Support Ticket, Payment. They stress-test it against "which customers are at churn risk due to repeated billing failures" \u2014 tracing Customer \u2192 has \u2192 Payment \u2192 status \u2192 Failed, cross-referenced with Subscription \u2192 status \u2192 Active. The model passes the test in under 10 minutes of whiteboard time, which is the actual signal that the ontology is ready to hand to engineering.</p></div>'},

    {id:'m19', group:'part3', num:'24', tag:'execution', title:'Build vs. Buy vs. Partner', skill:'Deciding whether to build agentic capability in-house, buy a platform, or integrate a specialized vendor.',
      body: '<p>Three real paths exist for any agentic capability: <b>build</b> it in-house (full control, slowest, needs real ML/engineering talent), <b>buy</b> a vertical platform or vendor solution (fast, but less differentiated and creates dependency), or <b>partner</b> \u2014 integrate a specialized vendor for one capability (often via an API or MCP server, Module 12) while building the parts that matter most yourselves.</p>'
      + '<p>The decision shouldn\u2019t hinge on upfront cost alone. The real question: is this capability <b>core to your competitive differentiation</b>, or is it <b>table-stakes infrastructure</b> that every competitor will also have? Core capability \u2192 lean build, or partner for the pieces that aren\u2019t your edge. Table-stakes \u2192 buy, and spend your engineering time elsewhere.</p>'
      + '<div class="acb-checkpoint"><span class="acb-cp-label">Skill checkpoint</span>Apply this framework to two different capabilities and justify each decision.</div>'
      + '<div class="acb-worked"><span class="acb-worked-label">Worked example</span><p>A bank builds its own fraud-detection GNN in-house \u2014 it runs on proprietary transaction data no vendor has access to, and catching fraud better than competitors is a genuine differentiator. The same bank buys an off-the-shelf AI meeting-transcription tool for internal team meetings \u2014 nobody\u2019s competitive advantage was ever going to come from a better meeting-notes feature, so building it themselves would just be wasted engineering time.</p></div>'},

    {id:'m20', group:'part4', num:'25', tag:'pm execution', title:'Writing an Agentic / AI PRD', skill:'What structurally changes in a PRD when the feature involves AI or an agent.',
      body: '<p>Standard PRD sections \u2014 problem, users, success metrics \u2014 still apply. But an AI or agentic feature needs sections most feature PRDs never touch:</p>'
      + '<ul><li><b>Data requirements</b> \u2014 what context does this need, and do we actually have it? (This is where Modules 3 and 16 stop being abstract and become a checklist.)</li>'
      + '<li><b>Guardrails</b> \u2014 what should the agent never do autonomously? (Directly reuses Module 17\u2019s permission-tier thinking.)</li>'
      + '<li><b>Fallback behavior</b> \u2014 what happens when the model is wrong, unsure, or the tool call fails? Who or what catches it?</li>'
      + '<li><b>Confidence/uncertainty handling</b> \u2014 does the interface communicate when the AI isn\u2019t sure, or does it always sound equally confident?</li></ul>'
      + '<p>Skipping these sections is the single most common reason an "AI feature" ships and then quietly causes an incident three weeks later \u2014 not because the model was bad, but because nobody had written down what it should never be allowed to do.</p>'
      + '<div class="acb-checkpoint"><span class="acb-cp-label">Skill checkpoint</span>Given a feature idea, draft just the Data Requirements and Guardrails sections.</div>'
      + '<div class="acb-worked"><span class="acb-worked-label">Worked example</span><p>PRD for a renewal-email drafting agent. Data requirements: billing API (expiry dates), CRM (contact history, past ticket sentiment). Guardrails: never auto-send if the customer\u2019s last support ticket was a complaint or cancellation request \u2014 route to a human instead; never quote current pricing to accounts on a legacy plan without a flag. Two short bullet lists, and the riskiest failure modes are already designed out before a line of code is written.</p></div>'},

    {id:'m21', group:'part4', num:'26', tag:'pm execution', title:'Success Metrics & ROI for AI Features', skill:'Business-level metrics for AI features \u2014 distinct from the technical evals in Module 16, and which ones matter depending on the feature type and stage.',
      body: '<p>Module 16 covered technical evals \u2014 accuracy, hallucination rate, latency. Those matter to engineers. This module covers what a PM actually reports upward: business outcomes. Traditional SaaS metrics (signups, DAU, churn) don\u2019t capture what actually matters for an AI feature, so this is a distinct metric vocabulary worth having cold.</p>'
      + '<h4>The core set</h4><ul><li><b>Adoption rate</b> \u2014 are people actually using it, or avoiding it</li>'
      + '<li><b>Cost per resolved interaction</b> \u2014 total token + infra cost divided by successful outcomes, not just calls made</li>'
      + '<li><b>Deflection rate</b> \u2014 how many cases get resolved without a human, for support/service-style features</li>'
      + '<li><b>Time saved per user</b> \u2014 the efficiency claim, actually measured rather than assumed</li>'
      + '<li><b>Override rate</b> \u2014 how often users manually override or ignore the AI\u2019s suggestion; a rising trend here is one of the earliest signals something\u2019s degrading, often before accuracy metrics visibly move</li></ul>'
      + '<h4>The metrics most teams forget</h4><ul><li><b>Task completion rate</b> \u2014 did the workflow actually finish successfully end to end, not just "did the model respond"</li>'
      + '<li><b>Acceptance rate</b> \u2014 for a suggestion-style feature (a drafted email, a code completion), how often is the suggestion used as-is</li>'
      + '<li><b>Edit rate</b> \u2014 when a suggestion is accepted but heavily edited first, that\u2019s a different signal than a clean accept \u2014 high edit rates often mean "close but not trusted," worth tracking separately from a binary accept/reject</li>'
      + '<li><b>Automation rate</b> \u2014 the share of the task the system completes without any human step at all, as distinct from deflection rate (which is specific to support/service contexts)</li>'
      + '<li><b>Precision / recall, conceptually</b> \u2014 precision asks "of what it flagged, how much was actually right"; recall asks "of everything it should have caught, how much did it catch." A fraud-detection feature that misses real fraud (low recall) and one that flags too many innocent transactions (low precision) fail in very different, both costly, ways \u2014 you don\u2019t need the formula, just the intuition that these pull in opposite directions and a PM has to decide which failure mode is worse for this specific feature</li>'
      + '<li><b>User trust</b> \u2014 often measured indirectly through override rate and edit rate rather than asked directly, since stated trust and revealed behavior frequently diverge</li>'
      + '<li><b>Retention of the AI feature specifically</b> \u2014 distinct from product retention overall; people can keep using your product while quietly abandoning the AI feature inside it</li></ul>'
      + '<h4>Which metrics matter depends on what you\u2019re measuring</h4><ul><li><b>Copilot-style features</b> (suggests, human decides) \u2014 acceptance rate, edit rate, and time saved matter most; the human stays the checkpoint, so completion rate is less central.</li>'
      + '<li><b>Autonomous agents</b> (act without a human in the loop each time) \u2014 task completion rate, automation rate, and override rate dominate; these features live or die on whether they can be trusted to finish the job correctly on their own.</li>'
      + '<li><b>Pilot stage</b> \u2014 prioritize override rate and edit rate; you\u2019re learning whether the system is trustworthy at all, not yet optimizing cost.</li>'
      + '<li><b>Production stage</b> \u2014 cost per resolved interaction and retention become central; trust is established, now the question is whether it\u2019s sustainably worth running.</li></ul>'
      + '<p>On ROI: compare total cost of building and <i>running</i> it (agentic systems have real, ongoing eval and monitoring costs, not just a one-time build cost) against the cost of the manual process it replaces \u2014 on a realistic timeline, not the optimistic one in the pitch deck.</p>'
      + '<div class="acb-checkpoint"><span class="acb-cp-label">Skill checkpoint</span>Propose 4 business-level metrics (not technical evals) for an AI feature of your choice, and state whether it\u2019s a copilot or an autonomous agent.</div>'
      + '<div class="acb-worked"><span class="acb-worked-label">Worked example</span><p>An AI-assisted loan-underwriting recommender \u2014 a copilot, since a human underwriter makes the final call \u2014 is tracked on: acceptance rate of its recommendation (is it actually useful, not just present), edit rate when underwriters adjust the recommended terms before approving (a "close but not quite" signal), override rate by underwriters (trust signal), and cost per application processed (ROI). Note what\u2019s absent: task completion rate and automation rate barely matter here, because a human is always the final checkpoint \u2014 exactly the copilot-vs-agent distinction this module makes, applied to a real feature instead of left abstract.</p></div>'},

    {id:'m29', group:'part4', num:'27', tag:'pm execution', title:'The AI Evaluation Playbook', skill:'A complete framework for how AI products actually get evaluated \u2014 which method to use when, and whose job each one is.',
      body: '<p>Module 16 introduced technical evals \u2014 golden test sets, LLM-as-judge. In practice, "evaluating an AI product" is a whole toolkit, not one technique, and reaching for the wrong one wastes real time.</p>'
      + '<table class="acb-table"><tr><th>Method</th><th>What it is</th><th>When it earns its place</th></tr>'
      + '<tr><td><b>Offline evaluation</b></td><td>Running a fixed test set against a new model/prompt before it ships</td><td>Before every release \u2014 cheap, fast, repeatable</td></tr>'
      + '<tr><td><b>Online evaluation (A/B testing)</b></td><td>Splitting real traffic between two versions and comparing real outcomes</td><td>The only way to measure actual user behavior change, not just test-set accuracy</td></tr>'
      + '<tr><td><b>Human evaluation</b></td><td>People directly reviewing outputs against a rubric</td><td>When quality is subjective or high-stakes enough that automated scoring alone isn\u2019t trustworthy</td></tr>'
      + '<tr><td><b>Golden datasets</b></td><td>The curated "known good" input/output pairs Module 16 introduced</td><td>The backbone offline eval runs against \u2014 without one, offline eval has nothing to compare to</td></tr>'
      + '<tr><td><b>Pairwise comparison</b></td><td>Showing two outputs side by side and asking "which is better"</td><td>People are far more reliable at relative judgments than absolute quality scores</td></tr>'
      + '<tr><td><b>LLM-as-judge</b></td><td>Another model scores outputs against criteria (Module 16)</td><td>Scales far beyond what human review can cover, at some cost in reliability</td></tr>'
      + '<tr><td><b>User satisfaction evaluation</b></td><td>Direct signals from real users \u2014 thumbs up/down, surveys, support tickets</td><td>Tests whether people actually like the outcome, not just whether it\u2019s "correct"</td></tr>'
      + '<tr><td><b>Regression testing</b></td><td>Re-running the golden dataset after any prompt, model, or pipeline change</td><td>Catches "we fixed one thing and silently broke three others" \u2014 the most common AI-product incident</td></tr></table>'
      + '<h4>Tradeoffs, in one line each</h4><ul><li>Offline eval is fast, but a golden dataset can miss real-world messiness it never anticipated.</li>'
      + '<li>Online A/B testing is the most truthful signal, but the slowest and riskiest \u2014 real users see the bad version too, if it is bad.</li>'
      + '<li>Human evaluation is the most trustworthy for subjective quality but doesn\u2019t scale and is expensive to run continuously.</li>'
      + '<li>LLM-as-judge scales cheaply but can share the same blind spots as the model it\u2019s judging.</li></ul>'
      + '<h4>PM responsibilities in this loop</h4><p>A PM doesn\u2019t usually write the evals \u2014 but owns deciding what "good" means for the golden dataset (a product judgment, not an engineering one), deciding when a change is safe to ship based on regression results, and making sure user-satisfaction signals actually reach the team, not just accuracy numbers on a dashboard nobody outside engineering opens.</p>'
      + '<div class="acb-callout"><b>Practical sequencing:</b> run offline eval on every change (cheap, constant); human eval or pairwise comparison before anything user-facing ships (expensive, occasional); online A/B testing only for changes big enough to justify real user exposure risk. Skipping straight to "ship it and see" without the cheaper gates first is how avoidable regressions reach production.</div>'
      + '<div class="acb-checkpoint"><span class="acb-cp-label">Skill checkpoint</span>Given a proposed change to an AI feature, decide which evaluation method(s) you\u2019d require before it ships, and in what order.</div>'
      + '<div class="acb-worked"><span class="acb-worked-label">Worked example</span><p>A team wants to swap the model powering a support copilot for a cheaper one (Module 22\u2019s territory). Sequence: first, run the existing golden dataset offline against the new model \u2014 if scores meaningfully drop, stop here. If it passes, run a pairwise comparison with a small human panel on the ambiguous cases the golden dataset doesn\u2019t cover well. If that also passes, launch a 10% A/B test and watch both the override rate (Module 26) and user satisfaction signals for two weeks before rolling out to everyone. Three gates, cheapest first \u2014 not a single leap from "looks fine in a demo" to "100% of production traffic."</p></div>'},

    {id:'m22', group:'part4', num:'28', tag:'pm execution', title:'Responsible AI: Risk, Bias & Compliance for PMs', skill:'Enough working knowledge to flag risk early \u2014 without needing to be a compliance expert.',
      body: '<p><b>Bias:</b> a model can inherit and amplify bias present in the data it was trained or fine-tuned on \u2014 a credit model trained on historically biased approval decisions will reproduce that bias, often invisibly. The PM\u2019s job isn\u2019t to fix this technically, it\u2019s to ask what historical data trained this, and to audit outcomes across customer segments, not just aggregate accuracy.</p>'
      + '<p><b>Explainability:</b> for regulated or high-stakes decisions (credit, hiring, healthcare), "the model said so" isn\u2019t an acceptable answer to a rejected customer. This can actually shape architecture choice \u2014 a system with an explicit knowledge graph and rules layer is often easier to explain than a purely end-to-end black-box model.</p>'
      + '<p><b>Data privacy/residency:</b> where is data processed, does the vendor train on your data \u2014 this connects directly back to Module 17\u2019s security thinking and Module 21\u2019s vendor evaluation.</p>'
      + '<div class="acb-checkpoint"><span class="acb-cp-label">Skill checkpoint</span>For a given AI feature, list 3 risk questions you\u2019d raise before launch.</div>'
      + '<div class="acb-worked"><span class="acb-worked-label">Worked example</span><p>An AI resume-screening feature raises three questions before launch: What historical hiring data trained this, and did that hiring process have known bias? Does the model indirectly correlate rejection with a protected attribute through a proxy variable like zip code or school name? Can a rejected candidate get a human-reviewable explanation if they ask? All three are answerable by a PM without an ML degree \u2014 they just have to be asked before launch, not after a complaint.</p></div>'},

    {id:'m23', group:'part4', num:'29', tag:'pm execution', title:'Stakeholder Alignment & Change Management', skill:'Managing the human side of an agentic rollout \u2014 the part no architecture diagram covers.',
      body: '<p>Agentic features change how people work, not just what the software does. Expect resistance framed as "will this replace my job" even when the actual goal is augmentation \u2014 and address it directly and early, not as a footnote in a launch email.</p>'
      + '<h4>Practical tactics</h4><ul><li>Involve frontline users in the Module 23 workshop itself, so the system reflects how they actually think \u2014 not just what engineering assumed</li>'
      + '<li>Pilot with a willing sub-team before a company-wide rollout</li>'
      + '<li>Publish the guardrails and fallback behavior (Module 25) so people know exactly when the AI will, and won\u2019t, act on its own \u2014 vague autonomy breeds more fear than clearly bounded autonomy</li></ul>'
      + '<div class="acb-checkpoint"><span class="acb-cp-label">Skill checkpoint</span>Identify the two stakeholder groups most likely to resist a given agentic feature, and one concrete step to bring each on board.</div>'
      + '<div class="acb-worked"><span class="acb-worked-label">Worked example</span><p>Rolling out an AI-drafted-email agent to a sales team: reps worry about losing their own voice in client communication. The mitigation wasn\u2019t a reassurance memo \u2014 it was a design decision: every draft stays editable and nothing auto-sends by default, and the few-shot examples (Module 13) feeding the model were built from each rep\u2019s own best past emails, so drafts actually sounded like them. Adoption resistance dropped because the concern was addressed in the product, not just in messaging.</p></div>'},

    {id:'m24', group:'part4', num:'30', tag:'pm execution', title:'Roadmapping a Phased Agentic Rollout', skill:'Sequencing an agentic build so risk and autonomy increase gradually, not all at once.',
      body: '<p>A crawl-walk-run structure for agent autonomy, building directly on Module 10\u2019s loop and Module 17\u2019s permission tiers:</p>'
      + '<ul><li><b>Crawl</b> \u2014 the agent drafts, a human approves every single action before it happens.</li>'
      + '<li><b>Walk</b> \u2014 the agent acts autonomously on low-risk actions per the permission tiers, and escalates anything uncertain to a human.</li>'
      + '<li><b>Run</b> \u2014 the agent handles the task end-to-end, with evals and monitoring (Module 16) as the safety net; human review shifts from every-action to spot-check.</li></ul>'
      + '<p>Each phase needs its own success metrics (Module 26) and explicit exit criteria before moving to the next one. The most common rollout mistake isn\u2019t moving too slowly \u2014 it\u2019s jumping straight to Run because a demo looked impressive, skipping the phase where you\u2019d have actually caught the failure modes.</p>'
      + '<div class="acb-checkpoint"><span class="acb-cp-label">Skill checkpoint</span>Sketch a 3-phase rollout plan for one agentic feature, including what triggers the move to the next phase.</div>'
      + '<div class="acb-worked"><span class="acb-worked-label">Worked example</span><p>The renewal-email agent again, phased: Crawl \u2014 every draft reviewed by a human for 4 weeks, no exceptions. Walk \u2014 auto-send enabled only for accounts with no negative support tickets in the last 90 days; flagged accounts still route to a human. Run \u2014 auto-send by default, human review becomes a weekly audit sample instead of every email. Exit criteria to leave Walk and enter Run: override rate stays under 5% for 6 consecutive weeks \u2014 a concrete, pre-agreed number, not a gut call.</p></div>'},

    {id:'m30', group:'part4', num:'31', tag:'pm execution', title:'AI Product Lifecycle', skill:'The end-to-end journey of building an AI product \u2014 stitching every module in Part 4 into one sequence, the way Module 11 did for the technical stack in Part 1.',
      body: '<p>Module 11 walked the technical pipeline end to end. This module does the same for the product development process \u2014 and the honest headline is that AI product development doesn\u2019t follow the traditional software lifecycle, because the thing being built doesn\u2019t behave deterministically the way a normal feature does.</p>'
      + '<h4>The stages</h4><ol><li><b>Problem discovery</b> \u2014 is this actually a problem worth solving, for whom, how often?</li>'
      + '<li><b>Selecting AI vs. traditional software</b> \u2014 the question most teams skip. If the logic can be written as clean rules, a rules engine is faster, cheaper, and more predictable. AI earns its place when the problem is genuinely ambiguous, unstructured, or too varied for rules to cover.</li>'
      + '<li><b>Prototyping</b> \u2014 fast, low-fidelity proof that the underlying capability, not the polished UI, actually works on real examples.</li>'
      + '<li><b>Prompt experimentation</b> \u2014 iterating on the system prompt (Module 13) well before any pipeline code gets built around it.</li>'
      + '<li><b>Evaluation</b> \u2014 building the golden dataset (Module 27) before, not after, deciding the feature is "ready."</li>'
      + '<li><b>Pilot rollout</b> \u2014 a small, willing group first \u2014 the Crawl phase from Module 30.</li>'
      + '<li><b>Human review</b> \u2014 every output checked, deliberately slow, while trust is still being earned.</li>'
      + '<li><b>Guardrails</b> \u2014 the boundaries from the PRD (Module 25) get implemented and tested, not just documented.</li>'
      + '<li><b>Production launch</b> \u2014 not a single event but the Walk/Run transition, with exit criteria actually met, not assumed.</li>'
      + '<li><b>Monitoring</b> \u2014 the observability layer (Module 16) running continuously, not a one-time launch check.</li>'
      + '<li><b>Continuous improvement</b> \u2014 unlike most shipped software, an AI feature keeps needing attention: model drift (Module 19), cost creep (Module 22), and shifting user behavior all require ongoing iteration, not a "done" state.</li></ol>'
      + '<h4>How this differs from traditional software development</h4><p>Traditional software: once it passes QA and ships, it behaves the same way forever until someone changes the code. An AI feature can silently degrade with no code change at all \u2014 the underlying model gets updated by a vendor, real-world data drifts from what the golden dataset assumed, or user behavior shifts. That\u2019s why continuous improvement isn\u2019t a nice-to-have stage here \u2014 it\u2019s structurally required, and a PM who treats launch as the finish line the way they would for a normal feature will be caught off guard by a slow, invisible decline months later.</p>'
      + '<div class="acb-callout"><b>PM takeaway:</b> the biggest lifecycle mistake isn\u2019t skipping a stage \u2014 it\u2019s treating "production launch" as the finish line the way a normal feature launch would be. For AI products, launch is closer to the halfway point.</div>'
      + '<div class="acb-checkpoint"><span class="acb-cp-label">Skill checkpoint</span>Pick one AI feature idea and walk it through all 11 stages, noting which ones your organization currently tends to skip.</div>'
      + '<div class="acb-worked"><span class="acb-worked-label">Worked example (complete end to end)</span><p>A retailer wants an AI feature to answer customer questions about order status. <b>Discovery:</b> support tickets show 30% of volume is repetitive order-status questions. <b>AI vs. traditional:</b> a rules engine checking order ID against a status API can actually handle 80% of this \u2014 the team scopes AI narrowly, only for the messier 20% (ambiguous phrasing, combined with a complaint, spanning multiple orders), instead of routing everything through an LLM by default. <b>Prototype:</b> a prompt-only test against 50 real historical tickets. <b>Prompt experimentation:</b> two weeks refining the system prompt and guardrails \u2014 never promise a refund, always cite actual order data. <b>Evaluation:</b> a 200-ticket golden dataset, human-labeled for correctness. <b>Pilot:</b> one support queue, three weeks, 100% human review; three real edge cases surfaced harden the guardrails. <b>Production launch:</b> rolled out queue by queue, Crawl to Walk, over six weeks, each with a defined override-rate exit criterion. <b>Monitoring:</b> cost-per-ticket and override-rate dashboards live from day one. <b>Continuous improvement:</b> three months in, a new shipping partner changes tracking-status language, and phrasing patterns drift \u2014 the golden dataset gets refreshed and the prompt updated, not treated as a one-time build.</p></div>'},

    {id:'gloss', group:'reference', num:'G', tag:'reference', title:'Glossary', skill:'Quick-reference definitions for every term above.',
      body: '<table class="acb-table"><tr><th>Term</th><th>Definition</th></tr>'
      + '<tr><td>Model</td><td>A trained pattern-recognizer; a file of learned weights</td></tr>'
      + '<tr><td>Training / Inference</td><td>Teaching the model (once) vs. the model making live predictions (every time)</td></tr>'
      + '<tr><td>Embedding</td><td>Turning anything into numbers such that similar things have similar numbers</td></tr>'
      + '<tr><td>Feature</td><td>An input variable fed to a model</td></tr>'
      + '<tr><td>Knowledge graph</td><td>Data stored as entities + relationships instead of tables</td></tr>'
      + '<tr><td>Ontology</td><td>The agreed vocabulary/schema of what entities and relationships are allowed to exist</td></tr>'
      + '<tr><td>GNN</td><td>A neural network that learns from graph-structured (relationship) data</td></tr>'
      + '<tr><td>RAG</td><td>Retrieving relevant data and inserting it into an LLM\u2019s prompt before it answers</td></tr>'
      + '<tr><td>GraphRAG</td><td>RAG that retrieves from a knowledge graph, preserving relationships, not just flat text</td></tr>'
      + '<tr><td>Data fabric</td><td>Architecture giving unified, live access to data across many source systems</td></tr>'
      + '<tr><td>Agent</td><td>An LLM in a loop that plans, calls tools, observes results, and acts autonomously</td></tr>'
      + '<tr><td>Tool / function calling</td><td>The mechanism letting an LLM request a structured action, which the host app executes and returns results from</td></tr>'
      + '<tr><td>MCP</td><td>Model Context Protocol \u2014 an open standard for connecting LLMs to external tools/data without custom integrations each time</td></tr>'
      + '<tr><td>ReAct</td><td>"Reason + Act" \u2014 the pattern of alternating explicit reasoning with tool actions</td></tr>'
      + '<tr><td>System prompt</td><td>Standing instructions that shape a model\u2019s role, tone, and constraints for a whole session</td></tr>'
      + '<tr><td>Chain-of-thought</td><td>Prompting the model to reason step by step before answering</td></tr>'
      + '<tr><td>Fine-tuning</td><td>Permanently adjusting a model\u2019s weights on custom examples, rather than instructing it at question-time</td></tr>'
      + '<tr><td>Context window</td><td>The maximum amount of text (tokens) a model can process in one call</td></tr>'
      + '<tr><td>Eval</td><td>A structured test set with known-good outputs, used to automatically check system performance</td></tr>'
      + '<tr><td>Prompt injection</td><td>Malicious instructions hidden in content an agent reads, attempting to hijack its behavior</td></tr>'
      + '<tr><td>Vector database</td><td>A database indexing embeddings for fast similarity search at scale</td></tr>'
      + '<tr><td>ANN search</td><td>Approximate Nearest Neighbor \u2014 finding closely-matching vectors without comparing against every stored one</td></tr>'
      + '<tr><td>Guardrails</td><td>Explicit limits on what an agent is never allowed to do autonomously</td></tr>'
      + '<tr><td>Override rate</td><td>How often users manually override or ignore an AI\u2019s suggestion \u2014 an early warning signal</td></tr>'
      + '<tr><td>Deflection rate</td><td>Share of cases an AI resolves without a human, in a support/service context</td></tr>'
      + '<tr><td>Crawl-walk-run</td><td>A phased rollout structure that increases an agent\u2019s autonomy gradually, with exit criteria between phases</td></tr>'
      + '<tr><td>Orchestrator / Supervisor agent</td><td>The agent (or framework) that decides which agent runs next and passes results between them</td></tr>'
      + '<tr><td>Context poisoning</td><td>Bad or malicious data absorbed into an agent\u2019s working context, polluting every step after</td></tr>'
      + '<tr><td>Model drift</td><td>Gradual, often invisible degradation in model performance as the model or its data landscape shifts over time</td></tr>'
      + '<tr><td>Input / output tokens</td><td>Tokens sent to a model (input) vs. generated by it (output) \u2014 usually priced differently, output typically higher</td></tr>'
      + '<tr><td>Prompt caching</td><td>Reusing a prior response or retrieval result instead of recomputing it \u2014 a high-leverage cost lever</td></tr>'
      + '<tr><td>Token</td><td>The unit a model actually reads \u2014 roughly a short word or word-fragment, and the unit cost, speed, and context window are measured in</td></tr>'
      + '<tr><td>Self-attention</td><td>The mechanism letting each token weigh how relevant every other token is to understanding it</td></tr>'
      + '<tr><td>Positional encoding</td><td>Information stamped onto each token marking its position in the sequence, so word order matters to the model</td></tr>'
      + '<tr><td>Golden dataset</td><td>A curated, agreed-upon set of "known good" input/output pairs used as the backbone for offline evaluation</td></tr>'
      + '<tr><td>Pairwise comparison</td><td>Judging two outputs side by side ("which is better") rather than scoring each in isolation</td></tr>'
      + '<tr><td>Regression testing (AI)</td><td>Re-running the golden dataset after any change to catch things silently broken elsewhere</td></tr>'
      + '<tr><td>Copilot vs. autonomous agent</td><td>A copilot suggests and a human decides; an autonomous agent acts \u2014 different metrics matter for each</td></tr></table>'},

        {id:'q11', text:'"Pairwise comparison" as an evaluation method is useful because:', options:['It eliminates the need for a golden dataset','People are more reliable at relative judgments ("which is better") than absolute quality scores','It only works for numeric data','It replaces online A/B testing entirely'], correct:1},
        {id:'q12', text:'The recommended evaluation sequencing before a risky change ships is:', options:['Launch to 100% of users immediately and monitor','Offline eval first, then human/pairwise review, then a limited online A/B test','Skip offline eval and go straight to human review','Online A/B test first, offline eval only if it fails'], correct:1},
        {id:'q13', text:'For a copilot-style feature (suggests, a human decides), which metrics matter most?', options:['Task completion rate and automation rate exclusively','Acceptance rate and edit rate','Only cost per resolved interaction','None of the metrics from this course apply to copilots'], correct:1},
        {id:'q14', text:'"Edit rate" (a suggestion accepted but heavily modified first) is a useful signal because:', options:['It is identical in meaning to acceptance rate','It indicates "close but not fully trusted," distinct from a clean accept or reject','It only matters for autonomous agents, never copilots','It measures latency, not quality'], correct:1},
        {id:'q15', text:'In the AI product lifecycle, "production launch" should be treated as:', options:['The finish line, the same as traditional software','Roughly the halfway point, since AI features require ongoing monitoring and improvement','An optional stage that can be skipped','The very first stage of development'], correct:1},
        {id:'q16', text:'The main reason AI product development differs from traditional software development is:', options:['AI features cost nothing to run once shipped','An AI feature can silently degrade with no code change at all, unlike most traditional software','AI features never need monitoring','Traditional software also requires continuous retraining'], correct:1}
      ]
    }
  };

  var GROUP_LABELS = {
    part1: 'Part 1 \u00b7 strategic fluency',
    part2: 'Part 2 \u00b7 engineering fluency',
    part3: 'Part 3 \u00b7 applied architecture',
    part4: 'Part 4 \u00b7 PM execution layer',
    reference: 'Reference'
  };

  var READ_STORAGE_KEY = 'ai-fluency-coursebook-progress';
  var readState = {};
  var quizState = {
    quiz1: {answers:{}, submitted:false, score:0},
    quiz2: {answers:{}, submitted:false, score:0},
    quiz3: {answers:{}, submitted:false, score:0},
    quiz4: {answers:{}, submitted:false, score:0}
  };
  var currentView = 'part1';
  var moduleObserver = null;

  var sideEl = document.getElementById('acb-side');
  var mainEl = document.getElementById('acb-main');
  var topLinksEl = document.getElementById('acb-toplinks');

  function prefersReducedMotion(){
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function modulesForView(view){
    if(view === 'part1') return modules.filter(function(m){ return m.group === 'part1'; });
    if(view === 'part2') return modules.filter(function(m){ return m.group === 'part2'; });
    if(view === 'part3') return modules.filter(function(m){ return m.group === 'part3'; });
    if(view === 'part4') return modules.filter(function(m){ return m.group === 'part4' || m.group === 'reference'; });
    return [];
  }

  /* ---------- Reading views (Part 1 / Part 2 / Part 3 / Part 4) ---------- */

  function renderReadingView(view){
    var list = modulesForView(view);

    var ringCirc = 103.7;
    sideEl.innerHTML =
      '<div class="acb-progress-row"><svg class="acb-ring" width="40" height="40" viewBox="0 0 40 40">'
      + '<circle cx="20" cy="20" r="16.5" fill="none" stroke="var(--line)" stroke-width="4"/>'
      + '<circle id="acb-ring-fg" cx="20" cy="20" r="16.5" fill="none" stroke="var(--edge)" stroke-width="4" stroke-linecap="round" stroke-dasharray="' + ringCirc + '" stroke-dashoffset="' + ringCirc + '" transform="rotate(-90 20 20)"/>'
      + '</svg><div class="acb-progress-text"><b id="acb-progress-count">0/' + list.length + '</b> sections read</div></div>'
      + '<ul class="acb-nav" id="acb-nav"></ul>'
      + '<button class="acb-reset" id="acb-reset">Reset progress</button>';

    var navEl = document.getElementById('acb-nav');
    var lastGroup = null;
    list.forEach(function(m){
      if(m.group !== lastGroup){
        var groupHeader = document.createElement('li');
        groupHeader.className = 'acb-nav-group';
        groupHeader.textContent = GROUP_LABELS[m.group] || m.group;
        navEl.appendChild(groupHeader);
        lastGroup = m.group;
      }
      var li = document.createElement('li');
      li.className = 'acb-nav-item';
      li.id = 'nav-' + m.id;
      li.innerHTML =
        '<span class="acb-node"><svg viewBox="0 0 12 10" fill="none"><path d="M1 5L4.5 8.5L11 1.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
        + '<button class="acb-nav-btn" data-target="' + m.id + '">'
        + '<span class="acb-nav-num">' + m.num + ' \u00b7 ' + m.tag + '</span>'
        + '<span class="acb-nav-label">' + m.title + '</span>'
        + '</button>';
      navEl.appendChild(li);
    });

    mainEl.innerHTML = '';
    lastGroup = null;
    list.forEach(function(m, i){
      if(m.group !== lastGroup){
        var divider = document.createElement('div');
        divider.className = 'acb-content-divider';
        divider.innerHTML = '<span class="acb-content-divider-text">' + (GROUP_LABELS[m.group] || m.group) + '</span><span class="acb-content-divider-line"></span>';
        mainEl.appendChild(divider);
        lastGroup = m.group;
      }
      var details = document.createElement('details');
      details.className = 'acb-module';
      details.id = 'mod-' + m.id;
      if(i === 0) details.open = true;
      details.innerHTML =
        '<summary>'
        + '<svg class="acb-chevron" viewBox="0 0 16 16" fill="none"><path d="M6 3L11 8L6 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        + '<div class="acb-summary-text">'
        + '<span class="acb-module-tag">Module ' + m.num + ' \u00b7 ' + m.tag + '</span>'
        + '<div class="acb-module-title">' + m.title + '</div>'
        + '<div class="acb-module-skill">' + m.skill + '</div>'
        + '</div>'
        + '<span class="acb-checkbox-wrap"><input type="checkbox" class="acb-checkbox" data-id="' + m.id + '" aria-label="Mark ' + m.title + ' as read"/><span class="acb-checkbox-label">read</span></span>'
        + '</summary>'
        + '<div class="acb-body">' + m.body + '</div>';
      mainEl.appendChild(details);
    });

    navEl.addEventListener('click', function(e){
      var btn = e.target.closest('.acb-nav-btn');
      if(!btn) return;
      var id = btn.getAttribute('data-target');
      var details = document.getElementById('mod-' + id);
      if(details){
        details.open = true;
        details.scrollIntoView({behavior: prefersReducedMotion() ? 'auto' : 'smooth', block:'start'});
      }
    });

    mainEl.querySelectorAll('.acb-checkbox').forEach(function(cb){
      cb.addEventListener('click', function(e){ e.stopPropagation(); });
      cb.addEventListener('change', function(){
        readState[cb.getAttribute('data-id')] = cb.checked;
        renderReadProgress(view);
        persistRead();
      });
    });

    if(moduleObserver) moduleObserver.disconnect();
    if(window.IntersectionObserver){
      moduleObserver = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          var id = entry.target.id.replace('mod-','');
          var navItem = document.getElementById('nav-' + id);
          if(!navItem) return;
          if(entry.isIntersecting) navItem.classList.add('active');
          else navItem.classList.remove('active');
        });
      }, {root: mainEl, rootMargin:'-20% 0px -70% 0px'});
      mainEl.querySelectorAll('.acb-module').forEach(function(el){ moduleObserver.observe(el); });
    }

    var resetBtn = document.getElementById('acb-reset');
    resetBtn.addEventListener('click', function(){
      if(resetBtn.dataset.confirming === '1'){
        list.forEach(function(m){ delete readState[m.id]; });
        renderReadProgress(view);
        persistRead();
        resetBtn.textContent = 'Reset progress';
        resetBtn.dataset.confirming = '0';
      } else {
        resetBtn.textContent = 'Click again to confirm';
        resetBtn.dataset.confirming = '1';
        setTimeout(function(){
          resetBtn.textContent = 'Reset progress';
          resetBtn.dataset.confirming = '0';
        }, 3000);
      }
    });

    renderReadProgress(view);
  }

  function renderReadProgress(view){
    var list = modulesForView(view);
    var ringFg = document.getElementById('acb-ring-fg');
    var progressCount = document.getElementById('acb-progress-count');
    if(!ringFg || !progressCount) return;
    var doneCount = 0;
    list.forEach(function(m){
      var read = !!readState[m.id];
      if(read) doneCount++;
      var navItem = document.getElementById('nav-' + m.id);
      if(navItem) navItem.classList.toggle('done', read);
      var cb = mainEl.querySelector('.acb-checkbox[data-id="' + m.id + '"]');
      if(cb) cb.checked = read;
    });
    var ringCirc = 103.7;
    var pct = list.length ? doneCount / list.length : 0;
    ringFg.setAttribute('stroke-dashoffset', String(ringCirc * (1 - pct)));
    progressCount.textContent = doneCount + '/' + list.length;
  }

  function persistRead(){
    try{ localStorage.setItem(READ_STORAGE_KEY, JSON.stringify(readState)); }
    catch(err){ console.error('Progress save failed:', err); }
  }

  function hydrateRead(){
    try{
      var raw = localStorage.getItem(READ_STORAGE_KEY);
      if(raw) readState = JSON.parse(raw);
    }catch(err){ readState = {}; }
  }

  /* ---------- Quiz views ---------- */

  function scoreQuiz(view){
    var quiz = quizzes[view], st = quizState[view];
    var correct = 0;
    quiz.questions.forEach(function(q){
      if(st.answers[q.id] === q.correct) correct++;
    });
    return correct;
  }

  function renderQuizSidebar(view){
    var quiz = quizzes[view], st = quizState[view];
    var answeredCount = Object.keys(st.answers).length;
    var summaryHtml;
    if(st.submitted){
      var pct = st.score / quiz.questions.length;
      var passed = pct >= quiz.passPct;
      summaryHtml = '<div class="acb-quiz-summary"><b>' + st.score + '/' + quiz.questions.length + '</b> correct \u2014 '
        + (passed ? '<b style="color:var(--edge)">PASS</b>' : '<b style="color:#B03D24">below 90%</b>') + '<br>Needs 14/15 (90%) to pass.</div>';
    } else {
      summaryHtml = '<div class="acb-quiz-summary"><b>' + answeredCount + '/' + quiz.questions.length + '</b> answered<br>Score 90%+ (14/15) to pass.</div>';
    }

    sideEl.innerHTML =
      '<div><div class="acb-eyebrow">' + quiz.label + '</div><div class="acb-title">' + quiz.subtitle + '</div></div>'
      + summaryHtml
      + '<ul class="acb-qnav" id="acb-qnav"></ul>'
      + '<button class="acb-reset" id="acb-quiz-reset">' + (st.submitted ? 'Retake quiz' : 'Clear answers') + '</button>';

    var qnav = document.getElementById('acb-qnav');
    quiz.questions.forEach(function(q, i){
      var dotClass = 'acb-qnav-dot';
      if(st.submitted){
        dotClass += (st.answers[q.id] === q.correct) ? ' correct' : ' incorrect';
      } else if(st.answers.hasOwnProperty(q.id)){
        dotClass += ' answered';
      }
      var li = document.createElement('li');
      li.className = 'acb-qnav-item';
      li.innerHTML = '<button class="acb-qnav-btn" data-target="' + view + '-' + q.id + '"><span class="' + dotClass + '"></span>Q' + (i+1) + '</button>';
      qnav.appendChild(li);
    });

    qnav.addEventListener('click', function(e){
      var btn = e.target.closest('.acb-qnav-btn');
      if(!btn) return;
      var target = document.getElementById('card-' + btn.getAttribute('data-target'));
      if(target) target.scrollIntoView({behavior: prefersReducedMotion() ? 'auto' : 'smooth', block:'start'});
    });

    var resetBtn = document.getElementById('acb-quiz-reset');
    resetBtn.addEventListener('click', function(){
      if(resetBtn.dataset.confirming === '1'){
        quizState[view] = {answers:{}, submitted:false, score:0};
        persistQuiz(view);
        renderQuizView(view);
      } else {
        resetBtn.textContent = 'Click again to confirm';
        resetBtn.dataset.confirming = '1';
        setTimeout(function(){
          if(resetBtn.dataset) { resetBtn.textContent = st.submitted ? 'Retake quiz' : 'Clear answers'; resetBtn.dataset.confirming = '0'; }
        }, 3000);
      }
    });
  }

  function renderQuizMain(view){
    var quiz = quizzes[view], st = quizState[view];
    var html = '<div class="acb-quiz-intro"><h3>' + quiz.label + '</h3>'
      + '<p>' + quiz.questions.length + ' single-select multiple choice questions covering ' + quiz.subtitle.split('\u2014')[1] + '.</p>'
      + '<p>Minimum score to qualify: <b>90% (14 of 15 correct)</b>.</p></div>';

    if(st.submitted){
      var pct = st.score / quiz.questions.length;
      var passed = pct >= quiz.passPct;
      html += '<div class="acb-result-banner ' + (passed ? 'pass' : 'fail') + '">'
        + '<span>' + (passed ? 'You qualified on this quiz.' : 'Below the 90% qualifying threshold \u2014 review and retake.') + '</span>'
        + '<span class="acb-result-score">' + st.score + ' / ' + quiz.questions.length + ' (' + Math.round(pct*100) + '%)</span>'
        + '</div>';
    }

    quiz.questions.forEach(function(q, i){
      html += '<div class="acb-qcard" id="card-' + view + '-' + q.id + '">'
        + '<div class="acb-qcard-num">Question ' + (i+1) + ' of ' + quiz.questions.length + '</div>'
        + '<div class="acb-qcard-text">' + q.text + '</div>'
        + '<div class="acb-qoptions">';
      q.options.forEach(function(opt, oi){
        var cls = 'acb-qoption';
        var tag = '';
        var checked = st.answers[q.id] === oi ? ' checked' : '';
        if(st.submitted){
          cls += ' disabled';
          if(oi === q.correct){ cls += ' correct'; tag = '<span class="acb-qoption-tag">Correct</span>'; }
          else if(st.answers[q.id] === oi){ cls += ' incorrect'; tag = '<span class="acb-qoption-tag">Your answer</span>'; }
        }
        html += '<label class="' + cls + '"><input type="radio" name="' + view + '_' + q.id + '" value="' + oi + '"' + checked + (st.submitted ? ' disabled' : '') + ' data-qid="' + q.id + '"/>' + opt + tag + '</label>';
      });
      html += '</div></div>';
    });

    if(!st.submitted){
      var answeredAll = Object.keys(st.answers).length === quiz.questions.length;
      html += '<div class="acb-qsubmit-row"><button class="acb-qsubmit" id="acb-qsubmit"' + (answeredAll ? '' : ' disabled') + '>Submit quiz</button>'
        + '<div class="acb-qsubmit-hint">' + Object.keys(st.answers).length + ' of ' + quiz.questions.length + ' answered' + (answeredAll ? '' : ' \u2014 answer all questions to submit') + '</div></div>';
    } else {
      html += '<div class="acb-qsubmit-row"><button class="acb-qretake" id="acb-qretake-bottom">Retake quiz</button></div>';
    }

    mainEl.innerHTML = html;

    mainEl.querySelectorAll('input[type=radio]').forEach(function(input){
      input.addEventListener('change', function(){
        st.answers[input.getAttribute('data-qid')] = parseInt(input.value, 10);
        persistQuiz(view);
        renderQuizSidebar(view);
        var submitBtn = document.getElementById('acb-qsubmit');
        var hint = mainEl.querySelector('.acb-qsubmit-hint');
        var answeredAll = Object.keys(st.answers).length === quiz.questions.length;
        if(submitBtn) submitBtn.disabled = !answeredAll;
        if(hint) hint.textContent = Object.keys(st.answers).length + ' of ' + quiz.questions.length + ' answered' + (answeredAll ? '' : ' \u2014 answer all questions to submit');
      });
    });

    var submitBtn = document.getElementById('acb-qsubmit');
    if(submitBtn){
      submitBtn.addEventListener('click', function(){
        st.score = scoreQuiz(view);
        st.submitted = true;
        persistQuiz(view);
        renderQuizView(view);
      });
    }
    var retakeBottom = document.getElementById('acb-qretake-bottom');
    if(retakeBottom){
      retakeBottom.addEventListener('click', function(){
        quizState[view] = {answers:{}, submitted:false, score:0};
        persistQuiz(view);
        renderQuizView(view);
      });
    }
  }

  function renderQuizView(view){
    renderQuizSidebar(view);
    renderQuizMain(view);
  }

  function persistQuiz(view){
    try{ localStorage.setItem('ai-fluency-' + view + '-state', JSON.stringify(quizState[view])); }
    catch(err){ console.error('Quiz save failed:', err); }
  }

  function hydrateQuiz(view){
    try{
      var raw = localStorage.getItem('ai-fluency-' + view + '-state');
      if(raw) quizState[view] = JSON.parse(raw);
    }catch(err){ /* no saved state yet */ }
  }

  /* ---------- View switching ---------- */

  function renderView(view){
    currentView = view;
    topLinksEl.querySelectorAll('.acb-toplink').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-view') === view);
    });
    if(view.indexOf('quiz') === 0){
      renderQuizView(view);
    } else {
      renderReadingView(view);
    }
  }

  topLinksEl.addEventListener('click', function(e){
    var btn = e.target.closest('.acb-toplink');
    if(!btn) return;
    renderView(btn.getAttribute('data-view'));
  });

  (function init(){
    hydrateRead();
    hydrateQuiz('quiz1');
    hydrateQuiz('quiz2');
    hydrateQuiz('quiz3');
    hydrateQuiz('quiz4');
    renderView('part1');
  })();
})();
</script>
